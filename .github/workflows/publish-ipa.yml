name: Publish IPA (manual)

# 公開は default branch からの明示的な手動実行だけに限定する。
# 毎回新しいタグを使い、既存のタグ・リリース・IPA は変更しない。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/build-ipa.yml

  publish:
    needs: build
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download this run's IPA
        uses: actions/download-artifact@v4
        with:
          name: KonomiTV-Viewer-unsigned-ipa
          path: artifacts/ipa

      - name: Verify source and package
        run: python3 scripts/verify-ipa.py artifacts/ipa --expected-sha "$GITHUB_SHA"

      - name: Publish a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # 一意な名前でも既存参照があれば止める。取得失敗も公開へ進めない。
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" > artifacts/tag-refs.json
          python3 -c 'import json; assert not json.load(open("artifacts/tag-refs.json")), "Release tag already exists"'
          printf 'Source commit: %s\nActions run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/release-notes.txt
          gh release create "$TAG" artifacts/ipa/*.ipa artifacts/ipa/build-info.json artifacts/ipa/checksums.txt \
            --target "$GITHUB_SHA" --title "KonomiTV Viewer $TAG" --prerelease \
            --notes-file artifacts/release-notes.txt
