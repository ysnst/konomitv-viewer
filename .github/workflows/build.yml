name: Build (unsigned IPA)

# ビルド。main への push で自動で回り、手動でも回せる。
# 本体は build-ipa.yml (共通) にある。
# このファイル名 (build.yml) は変えないこと。版番号はこのワークフローの
# 実行番号で数えており、ファイル名が変わると数え直しになってしまう。
# 以前は拡張版用の build-household.yml もあったが、版を1本にまとめたため
# 廃止した (改造版サーバー向けの機能はアプリ内の設定トグルで出し入れする)。

on:
  push:
    branches: [main]
    # 記録だけの変更ではビルドを回さない。
    paths-ignore:
      - 'build-result-v1.md'
  pull_request:
  workflow_dispatch:

# 固定タグのリリースへ IPA を置くため、リリースへの書き込み権限が要る。
permissions:
  contents: write

# 同じブランチの実行は重ねず、順番に1つずつ回す。重なると、
# 遅れて終わった古い実行が、新しい IPA を固定リリースから
# 消してしまうことがあるため。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-ipa.yml
    permissions:
      contents: write
