name: Build (unsigned IPA)

# 一般版のビルド。main への push で自動で回り、手動でも回せる。
# 本体は build-ipa.yml (共通) にあり、ここでは版の指定だけを渡す。
# このファイル名 (build.yml) は変えないこと。版番号はこのワークフローの
# 実行番号で数えており、ファイル名が変わると数え直しになってしまう。

on:
  push:
    branches: [main]
    # 記録だけの変更ではビルドを回さない。
    paths-ignore:
      - 'build-result-v1.md'
  pull_request:
  workflow_dispatch:

# 固定タグのリリースへ IPA を置くため、リリースへの書き込み権限が要る。
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-ipa.yml
    permissions:
      contents: write
    with:
      edition: general
      version_offset: 0
      release_tag: sideload-latest
