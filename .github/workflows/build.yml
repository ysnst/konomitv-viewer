name: Build (unsigned IPA)

# 作業ブランチでも基準IPAを作る。Artifact保存のみで、リリース公開は行わない。
# 版番号の数え方を保つため、このファイル名は変更しない。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-ipa.yml
