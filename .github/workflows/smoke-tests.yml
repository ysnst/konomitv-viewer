name: Smoke Tests

# 自動テスト (シミュレータでの起動確認)。IPA のビルド (build.yml) とは
# 別の実行ファイルに分けてあり、版番号 (build.yml の実行番号) の
# 数え方には一切触らない。テストが不安定でも、IPA の公開が
# 止まったり遅れたりすることはない。
#
# 起動のタイミングは、プルリクエストと手動を基本にする。
# main 以外のブランチへの push でも走る (main への push は IPA の
# ビルド側が担うため、こちらでは走らせない)。

on:
  pull_request:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Simulator smoke tests
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # アプリの接続先になる仮サーバー (SmokeTests/stub_server.py) を
      # 裏で起動し、応答が返るまで待つ。シミュレータの 127.0.0.1 は
      # 実行マシン自身につながるため、アプリからはこのサーバーが見える。
      - name: Start stub server
        run: |
          nohup python3 SmokeTests/stub_server.py 18080 > stub-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:18080/api/videos" > /dev/null; then
              echo "Stub server is ready."
              break
            fi
            sleep 1
          done
          curl -sf "http://127.0.0.1:18080/api/videos" | head -c 200
          echo

      # 再生部品 (MobileVLCKit) と字幕の部品 (libaribcaption) を
      # CocoaPods で入れる (IPA のビルドと同じ)。
      - name: Install CocoaPods dependencies
        working-directory: KonomiTV-Viewer
        run: pod install

      # 使える iPhone シミュレータのうち、最も新しい iOS のものを選ぶ
      # (名前で固定すると、実行環境の世代交代で無くなることがあるため)。
      - name: Pick a simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              version = runtime.rsplit("iOS-", 1)[1]
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((version, d["udid"], d["name"]))
          candidates.sort(key=lambda c: [int(x) for x in c[0].split("-")])
          if candidates:
              print(candidates[-1][1])
          ')
          if [ -z "$SIM_UDID" ]; then
            echo "使える iPhone シミュレータが見つかりませんでした。"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -F "$SIM_UDID" || true

      # シミュレータ向けにビルドだけ先に行う (テストの土台の確認。
      # 再生部品 VLCKit がシミュレータで使えるかもここで分かる)。
      - name: Build for testing (simulator)
        run: |
          xcodebuild build-for-testing \
            -workspace KonomiTV-Viewer/KonomiTV-Viewer.xcworkspace \
            -scheme SmokeTests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ビルド済みのものでテストを実行する。
      - name: Run smoke tests
        run: |
          xcodebuild test-without-building \
            -workspace KonomiTV-Viewer/KonomiTV-Viewer.xcworkspace \
            -scheme SmokeTests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/SmokeTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 失敗したときに切り分けられるよう、結果一式 (画面写真つき) と
      # 仮サーバーのログを残す。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            build/SmokeTestResults.xcresult
            stub-server.log
          if-no-files-found: ignore
