name: Build IPA (shared)

# ビルドと Artifact 保存だけを行い、タグ・リリースを変更する権限は持たない。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    # arm64 ランナーの容量不足で未開始のまま終了したため、Intel のプールを使う。
    runs-on: macos-26-intel
    env:
      TZ: Asia/Tokyo
      # 成功済みのビルドと同じ Xcode を選び、ホスト CPU 変更の影響を切り分ける。
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Xcode version
        run: |
          uname -m
          xcodebuild -version

      - name: Test artifact verification
        run: python3 scripts/test_verify_ipa.py

      - name: Test playback history model and request races
        run: |
          mkdir -p artifacts/tests
          swiftc -parse-as-library \
            KonomiTV-Viewer/KonomiTV-Viewer/WatchedHistoryStore.swift \
            scripts/HistoryStoreTests.swift -o artifacts/tests/history-tests
          artifacts/tests/history-tests

      - name: Test pagination geometry and direct page navigation
        run: |
          mkdir -p artifacts/tests
          swiftc -parse-as-library \
            KonomiTV-Viewer/KonomiTV-Viewer/PaginationGeometry.swift \
            scripts/PaginationTests.swift -o artifacts/tests/pagination-tests
          artifacts/tests/pagination-tests

      - name: Test caption seek state and received intervals
        run: |
          mkdir -p artifacts/tests
          swiftc -parse-as-library \
            KonomiTV-Viewer/KonomiTV-Viewer/CaptionPlaybackTimeline.swift \
            scripts/CaptionTimelineTests.swift -o artifacts/tests/caption-timeline-tests
          artifacts/tests/caption-timeline-tests

      - name: Test asynchronous playback start generations and pause intent
        run: |
          mkdir -p artifacts/tests
          swiftc -parse-as-library \
            KonomiTV-Viewer/KonomiTV-Viewer/PlaybackStartState.swift \
            scripts/PlaybackStartTests.swift -o artifacts/tests/playback-start-tests
          artifacts/tests/playback-start-tests

      - name: Test capture JPEG metadata compatibility
        run: |
          mkdir -p artifacts/tests artifacts/ipa
          swiftc -parse-as-library \
            KonomiTV-Viewer/KonomiTV-Viewer/CaptureMetadata.swift \
            scripts/CaptureMetadataTests.swift -o artifacts/tests/capture-metadata-tests
          artifacts/tests/capture-metadata-tests artifacts/ipa/capture-metadata-test.jpg

      # PR ではマージコミットをビルドするため、実際の checkout の SHA を記録する。
      - name: Compute version and source commit
        run: |
          echo "APP_VERSION=0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install CocoaPods dependencies
        working-directory: KonomiTV-Viewer
        run: pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          mkdir -p artifacts/ipa
          xcodebuild build \
            -workspace KonomiTV-Viewer/KonomiTV-Viewer.xcworkspace \
            -scheme KonomiTV-Viewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee artifacts/ipa/xcodebuild.log

      # アプリ内と Artifact に同じ来歴を残し、ファイル名にも短い SHA を含める。
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/KonomiTV-Viewer.app build/Payload/
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, plistlib, subprocess

          app = pathlib.Path('build/Payload/KonomiTV-Viewer.app')
          output = pathlib.Path('artifacts/ipa')
          sha = os.environ['SOURCE_SHA']
          ipa_name = f"KonomiTV-Viewer-unsigned-{os.environ['APP_VERSION']}-{sha[:12]}.ipa"
          info = {
              'commit_sha': sha,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'version': os.environ['APP_VERSION'],
              'build_number': os.environ['BUILD_NUMBER'],
              'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
          }
          metadata = json.dumps(info, ensure_ascii=False, indent=2) + '\n'
          (app / 'build-info.json').write_text(metadata, encoding='utf-8')
          (output / 'build-info.json').write_text(metadata, encoding='utf-8')
          plist_path = app / 'Info.plist'
          plist = plistlib.loads(plist_path.read_bytes())
          plist.update(CFBundleShortVersionString=info['version'],
                       CFBundleVersion=info['build_number'], KonomiTVViewerCommitSHA=sha)
          plist_path.write_bytes(plistlib.dumps(plist, fmt=plistlib.FMT_BINARY))
          subprocess.run(['zip', '-qry', str((output / ipa_name).resolve()), 'Payload'],
                         cwd='build', check=True)
          with (output / ipa_name).open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (output / 'checksums.txt').write_text(f'{digest}  {ipa_name}\n', encoding='utf-8')
          PY
          cp KonomiTV-Viewer/Podfile.lock artifacts/ipa/Podfile.lock
          python3 scripts/verify-ipa.py artifacts/ipa --expected-sha "$SOURCE_SHA"
          cat artifacts/ipa/build-info.json >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/ipa/checksums.txt >> "$GITHUB_STEP_SUMMARY"

      # ビルド失敗時にもログを持ち帰れるようにする。
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-Viewer-unsigned-ipa
          path: artifacts/ipa/
          if-no-files-found: error
