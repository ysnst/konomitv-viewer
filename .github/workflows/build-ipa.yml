name: Build IPA (shared)

# 署名なし IPA を作る本体。呼び出し側 (build.yml) から呼ばれる。
# このワークフローは署名を一切しない (証明書・プロファイルは使わない)。
#
# 版番号は呼び出し側ワークフローの実行番号で決める。以前は一般版 / 拡張版の
# 2種類を別の呼び出し側から作っていたが、版を1本にまとめたため、
# 呼び出し側は build.yml だけになった。改造版サーバー向けの機能は、
# アプリ内の設定トグルで出し入れする (AppEdition.swift)。

on:
  workflow_call:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    # 成果物 zip に記録される時刻がビルド機の現地時刻 (世界標準時) の壁時計になり、
    # 解凍したときに日本時間とずれて見えるのを防ぐため、ジョブ全体を日本時間にする。
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Asia/Tokyo
        run: |
          sudo systemsetup -settimezone "Asia/Tokyo"
          systemsetup -gettimezone
          date

      - name: Show Xcode version
        run: xcodebuild -version

      # 版番号と IPA のファイル名をここで確定させる。
      # 表示版は「0.<実行番号>」、内部のビルド番号も同じ数。
      - name: Compute version and IPA name
        run: |
          NUM=${{ github.run_number }}
          echo "APP_VERSION=0.$NUM" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$NUM" >> "$GITHUB_ENV"
          echo "IPA_NAME=KonomiTV-Viewer-unsigned-0.$NUM.ipa" >> "$GITHUB_ENV"
          echo "Version: 0.$NUM (run ${{ github.run_number }})"

      # 再生部品 (MobileVLCKit) と字幕の文字化の部品 (libaribcaption) を
      # CocoaPods で入れる。libaribcaption は公式の podspec が無いため、
      # ソースを KonomiTV-Viewer/Vendor/ に置いたローカルの pod として
      # Podfile から取り込む (この pod install の中で一緒に組み立てられる)。
      # 以後のビルドはプロジェクト単体ではなくワークスペース経由になる。
      - name: Install CocoaPods dependencies
        working-directory: KonomiTV-Viewer
        run: pod install

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -workspace KonomiTV-Viewer/KonomiTV-Viewer.xcworkspace \
            -scheme KonomiTV-Viewer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # アプリ本体・リリース説明・IPA のファイル名の3か所へ同じ版番号を入れて、
      # 「何を入れたか」が見分けられるようにする。
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/KonomiTV-Viewer.app" build/Payload/
          PLIST="build/Payload/KonomiTV-Viewer.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          cd build
          zip -r "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-Viewer-unsigned-ipa
          path: build/${{ env.IPA_NAME }}
          if-no-files-found: error

      # 取り方の本線は「固定タグのリリースに IPA をそのまま置く」形。
      # 毎回のビルドで同じリリースの中身 (IPA と説明) を差し替える。
      # IPA のファイル名には版番号が入るため、--clobber では名前違いの古い IPA が
      # 差し替わらずに残ってしまう。そのため、新しい IPA を先に上げてから、
      # 名前が違う古い IPA 資産を消し、最終的に「最新の IPA が1つだけ」に
      # なるようにする。先に消してから上げると、差し替えの間にリリースに
      # IPA が1つも無い時間ができ、その間に開くと 404 になってしまう
      # (2026-11-24 に実際に報告があったため、この順番にした)。
      # Source code の自動資産は .ipa で終わらないので、この削除には掛からない。
      - name: Publish IPA to fixed release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: sideload-latest
        run: |
          # この実行のコミットが main の先端でなくなっていたら、
          # 固定リリースへの公開は省く (遅れて終わった古い実行が、
          # 新しい IPA を消したり説明を巻き戻したりしないため)。
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" != "${{ github.sha }}" ]; then
            echo "この実行のコミット (${{ github.sha }}) は main の先端 ($LATEST_SHA) ではないため、公開を省きます。"
            exit 0
          fi
          IPA="build/$IPA_NAME"
          TITLE="最新の IPA"
          NOTES="版番号: $APP_VERSION
          ビルド日時 (日本時間): $(date '+%Y/%m/%d %H:%M')
          Actions 実行 ID: ${{ github.run_id }}
          実行ページ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 変更履歴 (CHANGELOG.md) の一番新しい版の要約を、説明へ足す。
          # 要約は、版の見出し (## 0.00) の直後から、詳しい一覧の見出し
          # (### ...) の前まで。変更履歴が無い・要約が空のときは足さない。
          if [ -f CHANGELOG.md ]; then
            SUMMARY=$(awk '
              /^## / { if (in_section) exit; in_section = 1; next }
              in_section && /^### / { exit }
              in_section { lines[++count] = $0 }
              END {
                while (count > 0 && lines[count] == "") count--
                for (i = 1; i <= count; i++) print lines[i]
              }
            ' CHANGELOG.md)
            if [ -n "$SUMMARY" ]; then
              NOTES="$NOTES

          この版の変更点:
          $SUMMARY"
            fi
          fi
          NOTES="$NOTES

          変更履歴 (すべての版): ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$IPA" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".ipa"))' | while IFS= read -r asset; do
            if [ "$asset" != "$IPA_NAME" ]; then
              echo "Deleting old IPA asset: $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset"
            fi
          done
          gh release view "$RELEASE_TAG"
